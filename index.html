<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>BUSINESS X</title>

<style>
:root{
--bg:#f3f4f6;--surface:rgba(255,255,255,.78);--solid:#fff;
--text:#171717;--muted:#777;--border:rgba(0,0,0,.09);
--accent:#171717;--soft:#e9e9e9;--shadow:0 8px 30px rgba(0,0,0,.055)
}
body.blue{
--bg:#eaf1fb;--surface:rgba(255,255,255,.78);--solid:#f8fbff;
--text:#10294d;--muted:#61748e;--border:rgba(32,83,145,.16);
--accent:#1d5fae;--soft:#dce9f8;--shadow:0 8px 30px rgba(18,58,105,.09)
}
body.blue .primary-btn{background:#1d5fae;color:#fff}
body.blue .brand-icon{background:#1d5fae;color:#fff}
body.dark{
--bg:#101010;--surface:rgba(35,35,35,.82);--solid:#202020;
--text:#f5f5f5;--muted:#aaa;--border:rgba(255,255,255,.1);
--accent:#fff;--soft:#303030;--shadow:0 8px 30px rgba(0,0,0,.2)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
transition:background .25s,color .25s}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{
width:245px;padding:25px 17px;background:var(--surface);
backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
border-right:1px solid var(--border);position:fixed;inset:0 auto 0 0;
z-index:10;overflow-y:auto
}
body[dir=rtl] .sidebar{left:auto;right:0;border-right:0;border-left:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:11px;margin:0 0 35px 5px}
.brand-icon{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;
background:var(--text);color:var(--bg);font-weight:900;font-size:20px}
.brand-name{font-size:18px;font-weight:850;letter-spacing:1px}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:3px}
.nav-label{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:1.5px;padding:0 12px;margin:23px 0 10px}
.nav-btn{width:100%;display:flex;align-items:center;gap:13px;padding:12px 13px;
border:0;border-radius:12px;color:var(--muted);background:transparent;text-align:start;
margin:3px 0;font-size:13px;font-weight:650;transition:.2s}
.nav-btn:hover,.nav-btn.active{background:var(--soft);color:var(--text)}
.nav-icon{width:20px;text-align:center;font-size:17px}
.sidebar-bottom{margin-top:25px;border-top:1px solid var(--border);padding-top:15px}
.main{margin-left:245px;width:calc(100% - 245px);padding:27px 32px 50px}
body[dir=rtl] .main{margin-left:0;margin-right:245px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:28px}
.page-title{font-size:25px;font-weight:800;margin:0}
.page-subtitle{color:var(--muted);font-size:12px;margin-top:6px}
.top-actions{display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;border:1px solid var(--border);border-radius:13px;background:var(--surface);color:var(--text)}
.language-select,.field{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:11px;padding:11px 12px;outline:none}
.language-select{font-size:12px;max-width:145px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:19px;padding:19px;box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}
.stat-label{font-size:12px;color:var(--muted);font-weight:600}
.stat-value{font-size:25px;font-weight:850;margin:12px 0 7px;letter-spacing:-.7px}
.stat-note{font-size:11px;color:var(--muted)}
.stat-icon{font-size:20px;margin-bottom:14px}
.content-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:17px;margin-bottom:18px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.section-title{font-size:15px;font-weight:800;margin:0}
.small-muted{font-size:11px;color:var(--muted)}
.chart{height:190px;display:flex;align-items:end;gap:13px;padding:10px 4px 0}
.chart-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px}
.bar-wrap{height:145px;width:100%;display:flex;align-items:end;justify-content:center}
.bar{width:65%;max-width:35px;border-radius:8px 8px 3px 3px;background:var(--text);opacity:.8;min-height:5px}
.chart-label{font-size:10px;color:var(--muted)}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:0}
.row-title{font-size:12px;font-weight:700}
.row-sub{font-size:10px;color:var(--muted);margin-top:4px}
.amount{font-size:12px;font-weight:800}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:550px}
th{text-align:start;color:var(--muted);font-size:10px;letter-spacing:.7px;padding:12px;border-bottom:1px solid var(--border)}
td{padding:14px 12px;border-bottom:1px solid var(--border);font-size:12px}
tr:last-child td{border-bottom:0}
.status{display:inline-block;border-radius:20px;padding:5px 9px;font-size:10px;font-weight:750;background:var(--soft)}
.primary-btn{background:var(--text);color:var(--bg);border:0;border-radius:11px;padding:11px 16px;font-size:12px;font-weight:750}
.secondary-btn{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:11px;padding:10px 14px;font-size:12px;font-weight:700}
.danger-btn{background:transparent;color:#d65b5b;border:1px solid #d65b5b;border-radius:10px;padding:8px 11px;font-size:11px}
.page-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.search{width:100%;max-width:260px}
.field{width:100%;font-size:13px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form-group{display:flex;flex-direction:column;gap:7px}
.form-group label{font-size:11px;font-weight:700;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:center;justify-content:center;padding:15px}
.modal-backdrop.show{display:flex}
.modal{width:100%;max-width:520px;background:var(--solid);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:23px;max-height:90vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:17px;font-weight:850}
.close-btn{border:0;background:var(--soft);color:var(--text);border-radius:9px;width:32px;height:32px}
.empty{text-align:center;padding:35px 10px;color:var(--muted);font-size:12px}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.setting-item{display:flex;justify-content:space-between;align-items:center;gap:15px}
.setting-name{font-size:13px;font-weight:750}
.setting-desc{font-size:11px;color:var(--muted);margin-top:5px}
.mobile-menu{display:none}
.notice{font-size:11px;color:var(--muted);line-height:1.6;margin-top:15px}
.document-preview{background:#fff;color:#171717;padding:28px;border-radius:12px;margin:12px 0}
.document-preview h2{margin:0 0 5px;font-size:23px}
.document-preview p{font-size:12px;line-height:1.6}
.document-preview table{min-width:0}
.document-preview th,.document-preview td{color:#222;border-bottom:1px solid #ddd}
.document-preview .doc-total{text-align:right;font-weight:800;margin-top:18px}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.content-grid{grid-template-columns:1fr}}
@media(max-width:700px){
.sidebar{width:270px;transform:translateX(-105%);transition:.25s}
body[dir=rtl] .sidebar{transform:translateX(105%)}
.sidebar.open{transform:translateX(0)!important}
.main,body[dir=rtl] .main{margin:0;width:100%;padding:19px 15px 85px}
.mobile-menu{display:inline-block}
.topbar{margin-bottom:22px}.page-title{font-size:21px}
.stats{gap:10px}.stat-value{font-size:20px}.card{padding:15px}
.settings-grid{grid-template-columns:1fr}.language-select{max-width:120px}
.form-grid{grid-template-columns:1fr}
}
@media print{
body{background:#fff!important;color:#111!important}
.sidebar,.topbar,.page-actions,.no-print,.modal-backdrop{display:none!important}
.main{margin:0!important;padding:0!important;width:100%!important}
.document-preview{display:block!important;border:0!important;box-shadow:none!important}
}
</style>
</head>

let lang=localStorage.getItem("bx_lang")||"en";
let theme=localStorage.getItem("bx_theme")||"light";
let page="dashboard";
let period="month";

const tr=k=>L[lang]?.[k]||L.en[k]||k;
const money=n=>"TSh "+Number(n||0).toLocaleString("en-US");
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now()+Math.floor(Math.random()*1000);

const defaults={
business:{name:"",phone:"",address:""},products:[],customers:[],sales:[],expenses:[],
quotations:[],invoices:[],receipts:[],taxes:[]
};

function loadData(){
try{
const raw=localStorage.getItem("businessXData");
if(!raw)return JSON.parse(JSON.stringify(defaults));
const d=JSON.parse(raw);
for(const k in defaults)if(d[k]===undefined)d[k]=JSON.parse(JSON.stringify(defaults[k]));
return d;
}catch(e){return JSON.parse(JSON.stringify(defaults))}
}
let data=loadData();
function save(){localStorage.setItem("businessXData",JSON.stringify(data))}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function val(id){return document.getElementById(id)?.value||""}
function num(id){return Number(val(id))||0}

function setTheme(v){
theme=["dark","light","blue"].includes(v)?v:"light";
document.body.classList.remove("dark","blue");if(theme!=="light")document.body.classList.add(theme);
localStorage.setItem("bx_theme",theme);
const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=theme==="dark"?"#101010":theme==="blue"?"#1d5fae":"#f3f4f6";
}

function setLang(v){
lang=L[v]?v:"en";localStorage.setItem("bx_lang",lang);
document.documentElement.lang=lang;document.body.dir=lang==="ar"?"rtl":"ltr";
document.getElementById("languageSelect").value=lang;
document.querySelectorAll("[data-i]").forEach(el=>el.textContent=tr(el.dataset.i));
render();
}

function openModal(title,html){
document.getElementById("modalTitle").textContent=title;
document.getElementById("modalContent").innerHTML=html;
document.getElementById("modalBackdrop").classList.add("show");
}
function closeModal(){document.getElementById("modalBackdrop").classList.remove("show")}

function field(label,id,type="text",required=true,extra=""){
return `<div class="form-group"><label>${label}</label><input class="field" id="${id}" type="${type}" ${required?"required":""} ${extra}></div>`;
}
function selectField(label,id,options){
return `<div class="form-group"><label>${label}</label><select class="field" id="${id}">${options}</select></div>`;
}
function stat(icon,label,value,note){
return `<div class="card"><div class="stat-icon">${icon}</div><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`;
}
function row(label,value){return `<div class="list-row"><span class="row-title">${label}</span><span class="amount">${value}</span></div>`}
function status(s){
if(s.received>=s.total)return `<span class="status">${tr("paid")}</span>`;
return s.received>0?`<span class="status">${tr("partial")}</span>`:`<span class="status">${tr("unpaid")}</span>`;
}
function go(p){
page=p;document.querySelectorAll(".nav-btn[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
document.getElementById("sidebar").classList.remove("open");render();
}

const pageTitleKeys={dashboard:"dashboard",newOrder:"newSale",sales:"sales",products:"products",customers:"customers",expenses:"expenses",quotations:"quotations",invoices:"invoices",receipts:"receipts",tax:"tax",reports:"reports",settings:"settings"};

function render(){
document.getElementById("pageTitle").textContent=tr(pageTitleKeys[page]||"dashboard");
const el=document.getElementById("pageContent");
const views={dashboard:dashboardPage,newOrder:orderPage,sales:salesPage,products:productsPage,customers:customersPage,expenses:expensesPage,quotations:quotationsPage,invoices:invoicesPage,receipts:receiptsPage,tax:taxPage,reports:reportsPage,settings:settingsPage};
el.innerHTML=views[page]();
if(page==="newOrder")bindOrderPage();
}

function dashboardPage(){
const total=data.sales.reduce((a,s)=>a+s.total,0);
const received=data.sales.reduce((a,s)=>a+s.received,0);
const expenses=data.expenses.reduce((a,e)=>a+e.amount,0);
const due=data.sales.reduce((a,s)=>a+s.total-s.received,0);
const months=Array(12).fill(0);
data.sales.forEach(s=>{let d=new Date(s.date+"T00:00:00");if(d.getFullYear()===new Date().getFullYear())months[d.getMonth()]+=s.total});
const max=Math.max(1,...months);
const labels=["J","F","M","A","M","J","J","A","S","O","N","D"];
return `<div class="stats">
${stat("↗",tr("totalSales"),money(total),tr("revenueNote"))}
${stat("◉",tr("cashReceived"),money(received),tr("cashNote"))}
${stat("↘",tr("expensesTotal"),money(expenses),tr("expensesNote"))}
${stat("◷",tr("outstanding"),money(due),tr("balanceNote"))}
</div>
<div class="content-grid">
<div class="card"><div class="section-head"><h3 class="section-title">${tr("salesOverview")}</h3><span class="small-muted">${new Date().getFullYear()}</span></div>
<div class="chart">${months.map((v,i)=>`<div class="chart-col"><div class="bar-wrap"><div class="bar" style="height:${Math.max(4,v/max*100)}%"></div></div><span class="chart-label">${labels[i]}</span></div>`).join("")}</div></div>
<div class="card"><div class="section-head"><h3 class="section-title">${tr("quickOverview")}</h3></div>
${row(tr("totalProducts"),data.products.length)}${row(tr("totalCustomers"),data.customers.length)}
${row(tr("quotations"),data.quotations.length)}${row(tr("invoices"),data.invoices.length)}
${row(tr("receipts"),data.receipts.length)}${row(tr("netCash"),money(received-expenses))}
<p class="notice">${tr("profitNote")}</p></div></div>
<div class="card"><div class="section-head"><h3 class="section-title">${tr("recentSales")}</h3><button class="secondary-btn" onclick="go('sales')">${tr("viewAll")}</button></div>${salesTable(data.sales.slice().reverse().slice(0,5))}</div>
<p class="notice">${tr("demoNotice")}</p>`;
}

function salesTable(items){
if(!items.length)return `<div class="empty">${tr("noSales")}</div>`;
return `<div class="table-wrap"><table><thead><tr><th>${tr("customer")}</th><th>${tr("product")}</th><th>${tr("date")}</th><th>${tr("amount")}</th><th>${tr("status")}</th></tr></thead><tbody>
${items.map(s=>`<tr><td>${esc(s.customer)}</td><td>${esc(s.product)}</td><td>${esc(s.date)}</td><td>${money(s.total)}</td><td>${status(s)}</td></tr>`).join("")}
</tbody></table></div>`;
}

function salesPage(){
return `<div class="page-actions"><input class="field search" placeholder="${tr("search")}" oninput="filterRows(this,'salesTable')"><button class="primary-btn" onclick="go('newOrder')">＋ ${tr("addSale")}</button></div>
<div class="card"><h3 class="section-title">${tr("sales")}</h3><div id="salesTable">${salesTable(data.sales.slice().reverse())}</div></div><p class="notice">${tr("demoNotice")}</p>`;
}

function productsPage(){
return `<div class="page-actions"><input class="field search" placeholder="${tr("search")}" oninput="filterRows(this,'productsTable')"><button class="primary-btn" onclick="productModal()">＋ ${tr("addProduct")}</button></div>
<div class="card"><h3 class="section-title">${tr("products")}</h3><div class="table-wrap"><table id="productsTable"><thead><tr><th>${tr("product")}</th><th>${tr("category")}</th><th>${tr("price")}</th><th>${tr("stock")}</th><th>${tr("actions")}</th></tr></thead><tbody>
${data.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td><button class="danger-btn" onclick="removeRecord('products',${p.id})">${tr("delete")}</button></td></tr>`).join("")||`<tr><td colspan="5" class="empty">${tr("noProducts")}</td></tr>`}
</tbody></table></div></div>`;
}

function customersPage(){
return `<div class="page-actions"><input class="field search" placeholder="${tr("search")}" oninput="filterRows(this,'customersTable')"><button class="primary-btn" onclick="customerModal()">＋ ${tr("addCustomer")}</button></div>
<div class="card"><h3 class="section-title">${tr("customers")}</h3><div class="table-wrap"><table id="customersTable"><thead><tr><th>${tr("customer")}</th><th>${tr("phone")}</th><th>${tr("actions")}</th></tr></thead><tbody>
${data.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td><button class="danger-btn" onclick="removeRecord('customers',${c.id})">${tr("delete")}</button></td></tr>`).join("")||`<tr><td colspan="3" class="empty">${tr("noCustomers")}</td></tr>`}
</tbody></table></div></div>`;
}

function expensesPage(){
return `<div class="page-actions"><input class="field search" placeholder="${tr("search")}" oninput="filterRows(this,'expensesTable')"><button class="primary-btn" onclick="expenseModal()">＋ ${tr("addExpense")}</button></div>
<div class="card"><h3 class="section-title">${tr("expenses")}</h3><div class="table-wrap"><table id="expensesTable"><thead><tr><th>${tr("description")}</th><th>${tr("category")}</th><th>${tr("date")}</th><th>${tr("amount")}</th><th>${tr("attachment")}</th><th>${tr("actions")}</th></tr></thead><tbody>
${data.expenses.slice().reverse().map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.category)}</td><td>${esc(e.date)}</td><td>${money(e.amount)}</td><td>${e.attachment?esc(e.attachment):tr("noAttachment")}</td><td><button class="danger-btn" onclick="removeRecord('expenses',${e.id})">${tr("delete")}</button></td></tr>`).join("")||`<tr><td colspan="6" class="empty">${tr("noExpenses")}</td></tr>`}
</tbody></table></div></div><p class="notice">${tr("demoNotice")}</p>`;
}

/* QUOTATIONS AND INVOICES */
function documentForm(kind,source=null){
const isQ=kind==="quotation";
const prefix=isQ?"QTN":"INV";
const docNo=source?.number||`${prefix}-${new Date().getFullYear()}-${String(uid()).slice(-6)}`;
const title=isQ?tr("newQuotation"):tr("newInvoice");
const customerOpts=data.customers.map(c=>`<option ${source?.customer===c.name?"selected":""}>${esc(c.name)}</option>`).join("");
const productOpts=data.products.map(p=>`<option value="${p.id}" ${source?.productId==p.id?"selected":""}>${esc(p.name)}</option>`).join("");
openModal(title,`<form id="docForm">
<div class="form-grid">
${field(isQ?tr("quotationNo"):tr("invoiceNo"),"docNo","text",true,`value="${esc(docNo)}" readonly`)}
${selectField(tr("customer"),"docCustomer",customerOpts)}
${field(tr("date"),"docDate","date",true,`value="${source?.date||today()}"`)}
${field(isQ?tr("validUntil"):tr("dueDate"),"docDue","date",true,`value="${source?.due||today()}"`)}
${selectField(tr("product"),"docProduct",productOpts)}
${field(tr("quantity"),"docQty","number",true,`min="1" value="${source?.qty||1}"`)}
${field(tr("unitPrice"),"docPrice","number",true,`min="0" value="${source?.price||""}"`)}
${field(tr("discount"),"docDiscount","number",false,`min="0" value="${source?.discount||0}"`)}
</div>
<div class="form-group" style="margin-top:13px"><label>${tr("notes")}</label><textarea class="field" id="docNotes" rows="2">${esc(source?.notes||"")}</textarea></div>
<div class="list-row"><span class="row-title">${tr("grandTotal")}</span><strong id="docTotal">—</strong></div>
<button class="primary-btn" style="width:100%;margin-top:15px">${isQ?tr("saveQuotation"):tr("saveInvoice")}</button>
</form>`);

function update(){
const p=data.products.find(x=>x.id===Number(val("docProduct")));
const q=num("docQty"),price=num("docPrice")||(p?.price||0),discount=num("docDiscount");
const total=Math.max(0,q*price-discount);
const el=document.getElementById("docTotal");if(el)el.textContent=money(total);
}
document.getElementById("docProduct").addEventListener("change",()=>{
const p=data.products.find(x=>x.id===Number(val("docProduct")));
if(p)document.getElementById("docPrice").value=p.price;update();
});
["docQty","docPrice","docDiscount"].forEach(id=>document.getElementById(id).addEventListener("input",update));
update();
document.getElementById("docForm").onsubmit=e=>{
e.preventDefault();
const p=data.products.find(x=>x.id===Number(val("docProduct")));
const qty=num("docQty"),price=num("docPrice"),discount=num("docDiscount");
if(!p||qty<=0||price<0||discount>qty*price){alert(tr("required"));return}
const record={
id:uid(),number:val("docNo"),customer:val("docCustomer"),date:val("docDate"),
due:val("docDue"),product:p.name,productId:p.id,qty,price,discount,
total:qty*price-discount,notes:val("docNotes"),status:"Unpaid",received:0
};
data[isQ?"quotations":"invoices"].push(record);
save();closeModal();render();
};
}

function documentTable(items,type){
const isQ=type==="quotation";
if(!items.length)return `<div class="empty">${tr(isQ?"noQuotations":"noInvoices")}</div>`;
return `<div class="table-wrap"><table id="${isQ?"quotationTable":"invoiceTable"}"><thead><tr><th>${isQ?tr("quotationNo"):tr("invoiceNo")}</th><th>${tr("customer")}</th><th>${tr("date")}</th><th>${tr("amount")}</th><th>${tr("status")}</th><th>${tr("actions")}</th></tr></thead><tbody>
${items.slice().reverse().map(d=>`<tr><td>${esc(d.number)}</td><td>${esc(d.customer)}</td><td>${esc(d.date)}</td><td>${money(d.total)}</td><td><span class="status">${esc(d.status||"Open")}</span></td><td><button class="secondary-btn" onclick="viewDocument('${type}',${d.id})">${tr("open")}</button> ${isQ?`<button class="secondary-btn" onclick="makeInvoice(${d.id})">${tr("convertInvoice")}</button>`:""}</td></tr>`).join("")}
</tbody></table></div>`;
}

function makeInvoice(id){
const q=data.quotations.find(x=>x.id===id);if(!q)return;
const inv={...q,id:uid(),number:`INV-${new Date().getFullYear()}-${String(uid()).slice(-6)}`,due:q.due,status:"Unpaid",received:0,sourceQuotation:q.number};
data.invoices.push(inv);save();go("invoices");
}

function viewDocument(type,id){
const d=data[type==="quotation"?"quotations":"invoices"].find(x=>x.id===id);if(!d)return;
const biz=data.business;
const title=type==="quotation"?tr("quotation"):tr("invoice");
const html=`<div class="document-preview" id="printArea">
<h2>${esc(biz.name||"BUSINESS X")}</h2>
<p>${esc(biz.address||"")}<br>${esc(biz.phone||"")}</p>
<hr>
<h2>${title}</h2><p><b>${type==="quotation"?tr("quotationNo"):tr("invoiceNo")}:</b> ${esc(d.number)}<br>
<b>${tr("customer")}:</b> ${esc(d.customer)}<br><b>${tr("date")}:</b> ${esc(d.date)}<br>
<b>${type==="quotation"?tr("validUntil"):tr("dueDate")}:</b> ${esc(d.due||"")}</p>
<table><thead><tr><th>${tr("product")}</th><th>${tr("quantity")}</th><th>${tr("unitPrice")}</th><th>${tr("amount")}</th></tr></thead>
<tbody><tr><td>${esc(d.product)}</td><td>${d.qty}</td><td>${money(d.price)}</td><td>${money(d.qty*d.price)}</td></tr></tbody></table>
<p class="doc-total">${tr("subtotal")}: ${money(d.qty*d.price)}<br>${tr("discount")}: ${money(d.discount)}<br><b>${tr("grandTotal")}: ${money(d.total)}</b></p>

<p style="margin-top:45px">_________________________<br>${esc(biz.name||"")}</p>

${type==="invoice"?`<button class="secondary-btn" onclick="openReceiptForInvoice(${d.id})">${tr("addReceipt")}</button>`:""}
</div>`;

}

function printDocument(){
const area=document.getElementById("printArea");if(!area)return;
const w=window.open("","_blank");
if(!w){alert("Please allow pop-ups to print this document.");return}
w.document.write(`<html><head><title>BUSINESS X Document</title><style>body{font-family:Arial;padding:35px;color:#111}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}.doc-total{text-align:right;margin-top:20px}</style></head><body>${area.outerHTML}<script>window.onload=()=>window.print()<\/script></body></html>`);

function saveBusiness(){
data.business.name=val("bName");data.business.address=val("bAddress");data.business.phone=val("bPhone");save();render();alert(tr("saved"));
}

function exportBackup(){
const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="business-x-backup.json";a.click();URL.revokeObjectURL(a.href);
}

function importBackup(){
const file=document.getElementById("backupFile").files[0];if(!file)return;
const reader=new FileReader();
reader.onload=()=>{
try{const imported=JSON.parse(reader.result);if(!imported.products||!imported.sales)throw Error();
data={...defaults,...imported};save();render();alert(tr("saved"));
}catch(e){alert("Invalid BUSINESS X backup file.")}
};
reader.readAsText(file);
}

/* HELPERS */
function removeRecord(type,id){
if(!confirm(tr("confirmDelete")))return;
data[type]=data[type].filter(x=>x.id!==id);save();render();
}
function filterRows(input,id){
const table=document.getElementById(id);if(!table)return;
table.querySelectorAll("tbody tr").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(input.value.toLowerCase())?"":"none");
}
